                    <label><input type="checkbox" name="plant_parts" value="Flor"> Flor</label>
                    <label><input type="checkbox" name="plant_parts" value="Fruto"> Fruto</label>

<script>
    // 1. CONFIGURACIÓN DE SUPABASE
    // Reemplaza estas credenciales con las de tu proyecto en Supabase
    const SUPABASE_URL = 'https://cjvkrimxllicwzqgcpad.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqdmtyaW14bGxpY3d6cWdjcGFkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5MDIxMjk0NSwiZXhwIjoyMTA1Nzg4OTQ1fQ.Nnkgi-vAsySK1e-3-qmk2gSR7jmq2XR_hHt-0eIEGps';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. INICIALIZACIÓN DE FECHA AUTOMÁTICA
    const setDate = () => {
        document.getElementById('current_date').valueAsDate = new Date();
    };
    window.onload = setDate;

    // 3. LÓGICA DE VALIDACIÓN Y CONTROL DE CALIDAD
    const form = document.getElementById('plantForm');
    const errorBanner = document.getElementById('error_banner');

    form.addEventListener('submit', async (e) => {
        e.preventDefault(); // Evita recargar la página
        let isValid = true;
        
        // Limpiar errores previos
        document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
        errorBanner.style.display = 'none';
        document.getElementById('group_parts').classList.remove('input-error');

        // Referencias a campos obligatorios
        const idField = document.getElementById('plant_id');
        const nameField = document.getElementById('common_name');
        const parts = document.querySelectorAll('input[name="plant_parts"]:checked');
        const doseG = document.getElementById('dose_g');
        const doseMl = document.getElementById('dose_ml');

        // Validar ID
        if (!idField.value.trim()) {
            idField.classList.add('input-error');
            isValid = false;
        }
        
        // Validar Nombre Común
        if (!nameField.value.trim()) {
            nameField.classList.add('input-error');
            isValid = false;
        }

        // Validar Partes Registradas (Mínimo 1)
        if (parts.length === 0) {
            document.getElementById('group_parts').classList.add('input-error');
            isValid = false;
        }

        // Validar Dosis y formato numérico (El HTML ya fuerza input type="number")
        if (!doseG.value || doseG.value <= 0) {
            doseG.classList.add('input-error');
            isValid = false;
        }
        if (!doseMl.value || doseMl.value <= 0) {
            doseMl.classList.add('input-error');
            isValid = false;
        }

        // Si hay errores, detener proceso y mostrar alerta visual
        if (!isValid) {
            errorBanner.style.display = 'block';
            errorBanner.scrollIntoView({ behavior: "smooth" });
            return;
        }

        // 4. RECOLECCIÓN Y ENVÍO DE DATOS A SUPABASE
        // Extraer arrays de checkboxes
        const selectedParts = Array.from(parts).map(cb => cb.value);
        const selectedContra = Array.from(document.querySelectorAll('input[name="contraindications"]:checked')).map(cb => cb.value);

        const recordData = {
            plant_id: idField.value.trim(),
            common_name: nameField.value.trim(),
            scientific_name: document.getElementById('scientific_name').value.trim(),
            harvest_season: document.getElementById('harvest_season').value,
            soil_type: document.getElementById('soil_type').value,
            plant_parts: selectedParts, // Se guarda como Array (JSON/Text Array en BD)
            prep_method: document.querySelector('input[name="prep_method"]:checked').value,
            dose_g: parseFloat(doseG.value),
            dose_ml: parseFloat(doseMl.value),
            toxicity: document.querySelector('input[name="toxicity"]:checked').value,
            contraindications: selectedContra, // Array
            comments: document.getElementById('comments').value.trim(),
            recorded_by: document.getElementById('user_role').value,
            recorded_at: document.getElementById('current_date').value
        };

        try {
            // Reemplaza 'etnobotanica_registros' con el nombre exacto de tu tabla
            const { data, error } = await supabase
                .from('etnobotanica_registros')
                .insert([recordData]);

            if (error) throw error;

            alert("¡Registro guardado exitosamente en la base de datos comunitaria!");
            resetForm();
            
        } catch (error) {
            console.error(error);
            alert("Error al conectar con la base de datos: " + error.message);
        }
    });

    function resetForm() {
        form.reset();
        setDate(); // Restaurar fecha tras borrar
        errorBanner.style.display = 'none';
        document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
    }
</script>
